<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDJ International College</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f3f6fb;
      color: #172033;
    }

    main {
      width: min(680px, calc(100% - 48px));
      padding: 48px;
      box-sizing: border-box;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(23, 32, 51, 0.12);
    }

    h1 {
      margin: 0 0 12px;
    }

    p {
      margin: 0;
      color: #526078;
    }
  </style>
</head>
<body>
  <main>
    <h1>SDJ International College</h1>
    <p>BCA Sem 6 — VAC &amp; SEC Selection</p>
  </main>
</body>
</html>
